# Prometheus 설정 - Kafka Consumer 메트릭 수집
# 기존 recommend-consumers job을 Kafka Consumer로 교체

# Kafka Consumer 메트릭 수집 설정
# 기존 Redis Consumer 타겟들(8002-8011)을 제거하고 Kafka Consumer(9000) 추가

scrape_configs:
  # 기존 설정 유지
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'spring-actuator'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['munova-api:8080']
    scrape_interval: 5s
    scrape_timeout: 4s

  - job_name: 'redis-exporter'
    static_configs:
      - targets: ['redis-exporter:9121']
    scrape_interval: 10s

  - job_name: 'recommend-server'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['recommend:8001']
    scrape_interval: 10s
    scrape_timeout: 5s

  # Kafka Consumer 메트릭 (기존 Redis Consumer 대체)
  - job_name: 'kafka-consumer'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['recommend:9000']  # Kafka Consumer Prometheus 메트릭 포트
        labels:
          service: 'kafka-consumer'
          instance: 'consumer-1'
    scrape_interval: 5s
    scrape_timeout: 4s

  # 기존 recommend-consumers job 제거됨 (Redis Consumer용이었음)
