syntax = "proto3";

package com.space.munova.log.proto;

// UserActionLog 메시지 정의
message UserActionLog {
  string event_type = 1;
  string service = 2;
  int64 member_id = 3;  // nullable은 -1로 처리 (0은 유효한 값일 수 있음)
  string data_json = 4;  // Map<String, Object>는 JSON 문자열로 직렬화
  int64 event_timestamp = 5;  // Instant를 long (milliseconds)으로
  int64 producer_time = 6;
  int32 version = 7;
}

